<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washington Jet - Elite Sky Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0c14;color:#fff;font-family:Arial,sans-serif}
.app{max-width:1280px;margin:auto;padding:10px 24px 24px}
.nav{height:60px;display:flex;align-items:center;gap:20px}
.balance{font-size:14px;font-weight:bold}.pb{font-size:14px;font-weight:bold;flex:1;text-align:center}
button{border:0;cursor:pointer;font-weight:bold;border-radius:5px}
.deposit{background:#00ff66;color:#0a0c14;padding:10px 18px}.withdraw{background:#232b3c;color:#fff;padding:10px 18px}
.divider{height:1px;background:#161a26}
.history{height:45px;display:flex;align-items:center;gap:6px;overflow:hidden}
.history span{padding:7px 9px;border-radius:5px;font-size:11px;font-weight:bold}
.low{background:#27272a;color:#a1a1aa}.mid{background:#1d4ed8;color:#93c5fd}.high{background:#581c87;color:#e9d5ff}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}
.gamebox{height:430px;position:relative;overflow:hidden;border:1px solid #161a26;background:linear-gradient(#5689c7,#7a9dc4 50%,#df6d4b)}
canvas{width:100%;height:100%;display:block}
.multiplier{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:64px;font-weight:bold}
.banner{position:absolute;left:0;right:0;top:59%;text-align:center;font-size:24px;font-weight:bold;color:#00ff66}
.controls{height:155px;background:#111522;margin-top:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr 310px;gap:8px}
.action{font-size:12px;background:#232b3c;color:#fff}.place{background:#00ff66;color:#0a0c14}
.cash{background:#232b3c;color:#fff}.auto{background:#232b3c;color:#94a3b8}
.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.matrix-title{grid-column:1/-1;color:#94a3b8;font-size:11px;padding-bottom:2px}
.bet{background:#1c2333;color:#94a3b8;font-size:10px}
.bet.selected{background:#00ff66;color:#0a0c14}
.sidebar{background:#111522;padding:16px;min-height:600px}
.sidebar h3{margin:0 0 14px;font-size:13px}
.feed{display:flex;flex-direction:column;gap:7px}.feed div{padding:10px 8px;border-radius:4px;font-size:10px;font-weight:bold}
.blue{background:#1d4ed8;color:#93c5fd}.purple{background:#581c87;color:#e9d5ff}
.light{background:#7042c4;color:#e9d5ff}.crash{background:#2e1a1d;color:#f87171}
@media(max-width:900px){
 .app{padding:8px}.workspace{grid-template-columns:1fr}.sidebar{min-height:auto}.controls{height:auto;grid-template-columns:1fr 1fr;padding:10px}.matrix{grid-column:1/-1}
 .nav{gap:8px}.pb{display:none}.gamebox{height:360px}.multiplier{font-size:48px}
}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="balance" id="balance">Balance: KES 10,000</div>
    <div class="pb" id="pb">Personal Best: 0.00x</div>
    <button class="deposit" onclick="deposit()">Deposit</button>
    <button class="withdraw" onclick="withdraw()">Withdraw</button>
  </div>
  <div class="divider"></div>
  <div class="history" id="history"></div>

  <div class="workspace">
    <main>
      <div class="gamebox" id="gamebox">
        <canvas id="sky"></canvas>
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="banner" id="banner"></div>
      </div>

      <div class="controls">
        <button class="action place" id="place" onclick="placeBet()">PLACE BET</button>
        <button class="action cash" id="cash" onclick="cashOut()">CASH OUT<br>(Inactive)</button>
        <button class="action auto" id="auto" onclick="toggleAuto()">AUTO BET<br>[OFF]</button>
        <div class="matrix">
          <div class="matrix-title">Bet Amount (KES)</div>
          <button class="bet" data-amount="10">10</button>
          <button class="bet" data-amount="20">20</button>
          <button class="bet" data-amount="50">50</button>
          <button class="bet selected" data-amount="100">100</button>
          <button class="bet" data-amount="500">500</button>
          <button class="bet" data-amount="1000">1,000</button>
          <button class="bet" data-amount="5000">5,000</button>
          <button class="bet" data-amount="10000">10,000</button>
        </div>
      </div>
    </main>

    <aside class="sidebar">
      <h3>LIVE FEED</h3>
      <div class="feed" id="feed"></div>
    </aside>
  </div>
</div>

<script>
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d");
const box=document.getElementById("gamebox");
let balance=10000, selectedBet=100, personalBest=0;
let running=false, playerActive=false, autoBet=false;
let multiplier=1, crashPoint=0, startTime=0, countdown=0;
let jet={x:70,y:330}, crashMode=false, crashStep=0;
let clouds=[], history=[2.34,1.05,14.20,1.12,5.40,1.89,43.10,2.01,1.55,9.44,120.45,1,3.21,18.50,1.02,4.50,22.10,1.15,3.40,1.88];
let botNames=["Saka","Merino","Odegaard","Rice","Gyokeres","Trossard","Raya","Haverts"];
let feed=[
 {text:"Saka cashed out KES 1,450 (1.45x)",type:"blue"},
 {text:"Merino cashed out KES 23,000 (2.30x)",type:"light"},
 {text:"Odegaard cashed out KES 150,000 (15.00x)",type:"purple"},
 {text:"Rice lost stake KES 500",type:"crash"},
 {text:"Gyokeres cashed out KES 8,200 (4.10x)",type:"light"}
];

function resize(){canvas.width=box.clientWidth;canvas.height=box.clientHeight}
window.addEventListener("resize",resize); resize();

document.querySelectorAll(".bet").forEach(b=>b.onclick=()=>{
 if(running||playerActive)return;
 selectedBet=Number(b.dataset.amount);
 document.querySelectorAll(".bet").forEach(x=>x.classList.remove("selected"));
 b.classList.add("selected");
});

function updateUI(){
 document.getElementById("balance").textContent=`Balance: KES ${balance.toLocaleString()}`;
 document.getElementById("pb").textContent=`Personal Best: ${personalBest.toFixed(2)}x`;
}
function renderHistory(){
 const h=document.getElementById("history");h.innerHTML="";
 [...history].reverse().forEach(v=>{
  const s=document.createElement("span");
  s.textContent=v.toFixed(2)+"x";
  s.className=v>=10?"high":v>=2?"mid":"low";
  h.appendChild(s);
 });
}
function renderFeed(){
 const f=document.getElementById("feed");f.innerHTML="";
 feed.slice(-6).forEach(x=>{let d=document.createElement("div");d.className=x.type;d.textContent=x.text;f.appendChild(d)});
}
function deposit(){balance+=10000;updateUI()}
function withdraw(){if(balance>=10000){balance-=10000;updateUI()}}

function placeBet(){
 if(running||playerActive)return;
 if(balance<selectedBet){if(autoBet)toggleAuto();return}
 balance-=selectedBet;playerActive=true;updateUI();
 document.getElementById("place").textContent="BET LOCKED";
}
function cashOut(){
 if(!playerActive||!running)return;
 const winnings=Math.floor(selectedBet*multiplier);
 balance+=winnings;playerActive=false;updateUI();
 document.getElementById("banner").textContent=`YOU WON KES ${winnings.toLocaleString()}!`;
 if(multiplier>personalBest){personalBest=multiplier;updateUI()}
 feed.push({text:`You cashed out KES ${winnings.toLocaleString()} (${multiplier.toFixed(2)}x)`,type:"purple"});
 renderFeed();document.getElementById("place").textContent="PLACE BET";
}
function toggleAuto(){
 autoBet=!autoBet;
 const b=document.getElementById("auto");
 b.innerHTML=autoBet?"AUTO BET<br>[ON]":"AUTO BET<br>[OFF]";
 b.style.background=autoBet?"#0284c7":"#232b3c";b.style.color=autoBet?"#fff":"#94a3b8";
 if(autoBet&&!running&&!playerActive)placeBet();
}
function generateCrash(){
 const r=Math.random();
 if(r<.65)return +(1.01+Math.random()*1.49).toFixed(2);
 if(r<.90)return +(2.51+Math.random()*12.49).toFixed(2);
 return +(15.01+Math.random()*104.99).toFixed(2);
}
function startCountdown(){
 document.getElementById("banner").textContent="";
 if(autoBet&&!playerActive)placeBet();
 countdown=3; countdownTick();
}
function countdownTick(){
 if(countdown>0){
  setMultiplier(`⏳ ${countdown}`,"#00ff66");
  countdown--;setTimeout(countdownTick,1000);
 }else startRound();
}
function startRound(){
 multiplier=1;
 crashPoint=generateCrash();
 running=true;
 crashMode=false;
 crashStep=0;
 jet={x:70,y:canvas.height-70};
 startTime=performance.now();

 setMultiplier("1.00x","#fff");

 const s=[...botNames].sort(()=>Math.random()-.5).slice(0,4);
 feed=[
  {text:`${s[0]} placed bet KES 1,000`,type:"blue"},
  {text:`${s[1]} placed bet KES 5,000`,type:"blue"},
  {text:`${s[2]} placed bet KES 10,000`,type:"blue"},
  {text:`${s[3]} placed bet KES 2,000`,type:"blue"}
 ];
 renderFeed();

 // Start a fresh browser animation frame with a valid timestamp.
 requestAnimationFrame(gameLoop);
}

function setMultiplier(text,color){
 const m=document.getElementById("multiplier");
 m.textContent=text;
 m.style.color=color;
}

function multiplierColor(){
 if(multiplier<2)return "#fff";
 if(multiplier<5)return "#00f0ff";
 if(multiplier<10)return "#ffb700";
 if(multiplier<50)return "#ff007f";
 return "#bc34fa";
}

function gameLoop(now){
 if(!running)return;

 // requestAnimationFrame supplies `now` in milliseconds.
 const elapsed=Math.max(0,(now-startTime)/1000);

 multiplier=+(1+Math.pow(elapsed*.45,1.35)).toFixed(2);

 if(multiplier>=crashPoint){
   multiplier=crashPoint;
   setMultiplier(multiplier.toFixed(2)+"x","#ef4444");
   draw();
   triggerCrash();
   return;
 }

 setMultiplier(multiplier.toFixed(2)+"x",multiplierColor());

 if(playerActive){
   const worth=Math.floor(selectedBet*multiplier);
   document.getElementById("cash").innerHTML=
     `CASH OUT<br>(KES ${worth.toLocaleString()})`;
   document.getElementById("cash").style.background="#ff6600";
 }else{
   document.getElementById("cash").innerHTML="CASH OUT<br>(Inactive)";
   document.getElementById("cash").style.background="#232b3c";
 }

 // Move the jet every animation frame.
 const speed=1.8+multiplier*.32;
 jet.x=Math.min(canvas.width-100,jet.x+speed);
 jet.y=Math.max(55,jet.y-speed*.45);

 draw();

 // Keep the animation running.
 requestAnimationFrame(gameLoop);
}

function triggerCrash(){
 running=false;crashMode=true;crashStep=0;
 document.getElementById("cash").innerHTML="CASH OUT<br>(KES 0)";
 document.getElementById("cash").style.background="#ef4444";
 document.getElementById("place").textContent="PLACE BET";
 history.push(crashPoint);if(history.length>20)history.shift();renderHistory();
 feed=feed.map(x=>x.text.includes("placed bet")?{text:x.text.split(" ")[0]+" lost stake",type:"crash"}:x);
 if(playerActive){playerActive=false;feed.push({text:"You lost stake",type:"crash"})}
 renderFeed();animateCrash();
}
function animateCrash(){
 if(!crashMode)return;
 if(crashStep<25){jet.x=Math.min(canvas.width-120,jet.x+4);jet.y=Math.min(canvas.height-45,jet.y+14);crashStep++;draw();setTimeout(animateCrash,25)}
 else{crashMode=false;setTimeout(startCountdown,3000)}
}
function draw(){
 const w=canvas.width,h=canvas.height;
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#5689c7");g.addColorStop(.5,"#7a9dc4");g.addColorStop(1,"#df6d4b");
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 drawClouds(w,h);drawJet(jet.x,jet.y);
}
function drawClouds(w,h){
 if(clouds.length===0)for(let i=0;i<6;i++)clouds.push({x:Math.random()*w,y:20+Math.random()*(h-200),speed:.4+Math.random()*.7,s:.7+Math.random()*.6});
 clouds.forEach(c=>{c.x+=c.speed;if(c.x>w+120)c.x=-130;ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(c.x,c.y,45*c.s,20*c.s,0,0,Math.PI*2);ctx.ellipse(c.x+35*c.s,c.y-8,38*c.s,25*c.s,0,0,Math.PI*2);ctx.fill()});
}
function drawJet(x,y){
 ctx.save();
 if(running && !crashMode){
   ctx.strokeStyle="rgba(255,255,255,.45)";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.moveTo(x-35,y+10);
   ctx.lineTo(Math.max(0,x-150),y+45);
   ctx.stroke();
 }
ctx.translate(x,y);
 if(running){ctx.fillStyle="#ff3300";ctx.beginPath();ctx.moveTo(-35,8);ctx.lineTo(-75,22+Math.random()*8);ctx.lineTo(-35,22);ctx.fill();ctx.fillStyle="#ffcc00";ctx.beginPath();ctx.moveTo(-35,10);ctx.lineTo(-60,17);ctx.lineTo(-35,18);ctx.fill()}
 ctx.fillStyle="#e2e8f0";ctx.strokeStyle="#94a3b8";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(4,7,32,14,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(25,-2);ctx.lineTo(62,7);ctx.lineTo(18,21);ctx.fill();
 ctx.fillStyle="#1d4ed8";ctx.beginPath();ctx.moveTo(-25,7);ctx.lineTo(-48,-8);ctx.lineTo(-18,2);ctx.fill();
 ctx.beginPath();ctx.moveTo(-18,22);ctx.lineTo(-38,38);ctx.lineTo(-8,23);ctx.fill();
 ctx.fillStyle="#38bdf8";ctx.beginPath();ctx.arc(10,7,6,0,Math.PI*2);ctx.fill();ctx.restore();
}
renderHistory();renderFeed();draw();updateUI();
setTimeout(startCountdown,1000);
</script>
</body>
</html>
